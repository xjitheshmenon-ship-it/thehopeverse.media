# Pronunciation test: the same Hindi and French lines read by each ElevenLabs model, with the voices the Shorts use,
# so the owner can hear which one says the words right. Nothing is posted. About 1,500 characters of credit.
# Start it by pushing a branch named run/voice-sample. The mp3s land on the voice-samples branch.
name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Each model reads a Hindi and a French line
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          key = os.environ["ELEVENLABS_API_KEY"].strip()
          src = Path("video.py").read_text()
          ns = {}
          exec(src[src.index("ELEVEN_PREFER ="):src.index("GAP =")], ns)  # the same settings the Shorts use
          voices = json.load(urllib.request.urlopen(urllib.request.Request(
              "https://api.elevenlabs.io/v1/voices", headers={"xi-api-key": key})))["voices"]
          for v in voices:
              print(v["name"], v.get("category"), v["voice_id"], v.get("labels"))
          pick = {}
          for gender, names in (("male", ("Brian", "Daniel")), ("female", ("Sarah", "Alice"))):
              pick[gender] = next(v for n in names for v in voices
                                  if v["name"].startswith(n) and (v.get("labels") or {}).get("gender") == gender)
          lines = {"hi": ("आज की सबसे बड़ी ख़बर, और वो सवाल जो कोई नहीं पूछ रहा। सरकार ने बजट में क्या छुपाया?", "male"),
                   "fr": ("Ce petit poisson nettoie la bouche d'un requin, et le requin ne le mange jamais. Pourquoi ?", "female")}
          models = ["eleven_multilingual_v2", "eleven_v3", "eleven_v4", "eleven_flash_v2_5"]
          os.makedirs("samples", exist_ok=True)
          def say(body, voice):
              req = urllib.request.Request(
                  f"https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128",
                  data=json.dumps(body).encode(), headers={"xi-api-key": key, "Content-Type": "application/json"})
              return urllib.request.urlopen(req, timeout=120).read()
          for lang, (text, gender) in lines.items():
              voice = pick[gender]
              for model in models:
                  base = {"text": text, "model_id": model, "voice_settings": ns["ELEVEN_SETTINGS"]}
                  tries = [dict(base, previous_text="Namaste.", language_code=lang), dict(base, language_code=lang),
                           dict(base, language_code=lang, voice_settings=dict(ns["ELEVEN_SETTINGS"], stability=0.5)), base]
                  for body in tries:
                      try:
                          audio = say(body, voice["voice_id"])
                      except Exception as e:
                          print(f"  {model} {lang} {sorted(body)}: {e} {getattr(e, 'read', lambda: b'')()[:300]!r}")
                          continue
                      Path(f"samples/{lang}-{model}-{voice['name'].split(' ')[0]}.mp3").write_bytes(audio)
                      print(f"OK {model} {lang} accepts {sorted(body)} stability={body['voice_settings']['stability']}")
                      break
          PY
      - run: |
          cd samples
          git init -q -b voice-samples && git add . 
          git -c user.name=hope -c user.email=hope@users.noreply.github.com commit -qm "Voice samples"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-samples
