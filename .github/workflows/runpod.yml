# LTX-2.5 backup on RunPod (owner, 3 Nov 2026): used when Modal fails or runs out (ltx.py, video.py and film.py).
# Push run/runpod with "job=setup" once (creates the volume, template and endpoint, saves runpod.json on main),
# then "job=test" makes one text-only shot and keeps it as an artifact to look at.
name: RunPod LTX

on:
  workflow_dispatch:
    inputs:
      job:
        description: "setup = create the RunPod endpoint, test = make one shot, health = show workers and queue, gpus = clear the queue and widen the GPU types"
        default: test
        type: choice
        options: [setup, test, health, gpus]

permissions:
  contents: write

jobs:
  runpod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # 80 GB cards only (LTX-2.5 + Qwen); the volume pins workers to one data center (US-TX-3), so allow several types
      GPUS: '["NVIDIA H100 80GB HBM3", "NVIDIA H100 PCIe", "NVIDIA H100 NVL", "NVIDIA H200", "NVIDIA A100-SXM4-80GB", "NVIDIA A100 80GB PCIe"]'
    steps:
      - uses: actions/checkout@v5
      - name: Create the network volume, template and endpoint
        if: inputs.job == 'setup'
        run: |
          [ -n "$RUNPOD_API_KEY" ] || { echo "::error::RUNPOD_API_KEY secret is missing"; exit 1; }
          api() { curl -sS -X "$1" "https://rest.runpod.io/v1/$2" -H "Authorization: Bearer $RUNPOD_API_KEY" -H "Content-Type: application/json" ${3:+-d "$3"}; }
          echo "Data centers with H100:"; api GET "datacenters" | jq -c '.[]? | {id, gpus: [.gpuAvailability[]? | select(.gpuTypeId | test("H100")) | .gpuTypeId]}' || true
          vol=""
          for dc in US-KS-2 US-TX-3 EU-RO-1 EUR-IS-1 US-GA-2 CA-MTL-1; do  # first data center that takes the volume
            out=$(api POST networkvolumes "{\"name\":\"ltx-cache\",\"size\":100,\"dataCenterId\":\"$dc\"}"); echo "$dc: $out"
            vol=$(jq -r '.id // empty' <<< "$out"); [ -n "$vol" ] && break
          done
          [ -n "$vol" ] || { echo "::error::No network volume could be created"; exit 1; }
          start='pip install -q runpod transformers accelerate sentencepiece imageio imageio-ffmpeg av hf_transfer https://github.com/huggingface/diffusers/archive/main.zip && curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/runpod_ltx.py -o /h.py && python -u /h.py'
          tpl=$(api POST templates "$(jq -n --arg s "$start" --arg hf "$HF_TOKEN" '{name: "hopeverse-ltx", imageName: "pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime",
                isServerless: true, containerDiskInGb: 40, dockerStartCmd: ["bash", "-c", $s],
                env: {HF_TOKEN: $hf, HF_HOME: "/runpod-volume/hf", HF_HUB_ENABLE_HF_TRANSFER: "1"}}')"); echo "$tpl" | jq 'del(.env)'
          tid=$(jq -r .id <<< "$tpl")
          ep=$(api POST endpoints "$(jq -n --arg t "$tid" --arg v "$vol" --argjson gpus "$GPUS" '{name: "hopeverse-ltx", templateId: $t, networkVolumeId: $v,
                gpuTypeIds: $gpus, workersMin: 0, workersMax: 1,
                idleTimeout: 300, executionTimeoutMs: 2400000}')"); echo "$ep"
          id=$(jq -r '.id // empty' <<< "$ep"); [ -n "$id" ] || { echo "::error::Endpoint not created"; exit 1; }
          jq -n --arg e "$id" --arg v "$vol" --arg t "$tid" '{endpoint: $e, volume: $v, template: $t}' > runpod.json
          git config user.name "Hope (RunPod setup)"; git config user.email "actions@github.com"
          git add runpod.json && git commit -m "RunPod LTX endpoint $id" && git push
      - name: Show RunPod workers and queue
        if: inputs.job == 'health'
        run: |
          ep=$(jq -r .endpoint runpod.json)
          curl -sS "https://api.runpod.ai/v2/$ep/health" -H "Authorization: Bearer $RUNPOD_API_KEY"; echo
          curl -sS "https://api.runpod.io/graphql?api_key=$RUNPOD_API_KEY" -H "Content-Type: application/json" \
            -d '{"query":"{ dataCenters { id gpuAvailability { gpuTypeId stockStatus available } } myself { clientBalance currentSpendPerHr } }"}' \
            | jq -c '.data.myself, (.data.dataCenters[]? | {id, gpus: [.gpuAvailability[]? | select(.stockStatus != null and (.gpuTypeId | test("H100|H200|A100|L40|6000"))) | "\(.gpuTypeId)=\(.stockStatus)"]} | select(.gpus | length > 0)), .errors'
          curl -sS "https://rest.runpod.io/v1/endpoints/$ep?includeWorkers=true" -H "Authorization: Bearer $RUNPOD_API_KEY" | jq 'del(.template.env, .env)'
      - name: Clear the queue and widen the GPU types
        if: inputs.job == 'gpus'
        run: |
          ep=$(jq -r .endpoint runpod.json)
          curl -sS -X POST "https://api.runpod.ai/v2/$ep/purge-queue" -H "Authorization: Bearer $RUNPOD_API_KEY"; echo
          curl -sS -X PATCH "https://rest.runpod.io/v1/endpoints/$ep" -H "Authorization: Bearer $RUNPOD_API_KEY" -H "Content-Type: application/json" \
            -d "$(jq -n --argjson g "$GPUS" '{gpuTypeIds: $g}')" | jq -c '{id, gpuTypeIds, workersMax}'
      - name: Make one test shot on RunPod
        if: inputs.job == 'test'
        run: |
          python -c "
          from pathlib import Path; import runpod_ltx as r
          print('cost', r.runpod_clip('A Laysan albatross walking on a sandy island beach at golden hour, natural movement. No text.', Path('runpod-test.mp4')))"
      - uses: actions/upload-artifact@v4
        if: inputs.job == 'test'
        with:
          name: runpod-test
          path: runpod-test.mp4
