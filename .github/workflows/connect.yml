# Sign a YouTube channel in, no PC needed. Actions > "Connect a channel" > Run workflow.
# Run 1: leave signin_url empty; the Google link is in the log under "Sign the channel in".
# Run 2: paste the address the browser lands on ("can't connect to localhost") as signin_url.
name: Connect a channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel"
        default: yt-kissa
        type: choice
        options: [yt-kissa, yt-instinct, yt-sankalp, yt-sawaal, yt-hopeverse-hi, yt-hopeverse, yt-unoreverse]
      signin_url:
        description: "Leave empty for the sign-in link, then paste the address the browser lands on (or type brand to refresh the About text and banner)"
        default: ""
        type: string

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth-oauthlib
      - run: printf '%s' "$CLIENT_SECRET" > client_secret.json
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      - run: python state.py load
      - name: Unlock saved sign-ins (for signin_url "brand")
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true
      - name: Sign the channel in
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          SIGNIN_URL: ${{ inputs.signin_url }}
          CHANNEL: ${{ inputs.channel }}
        run: python connect.py "$CHANNEL" "$SIGNIN_URL"
      - name: Save the sign-in
        if: inputs.signin_url != '' && inputs.signin_url != 'brand'
        run: python state.py save
