# Write and post one series episode (Kissa or Uno Reverse) right now, without the rest of the daily run.
# Actions > "Post a Kissa episode" > Run workflow.
name: Post a Kissa episode

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which series"
        default: yt-kissa
        type: choice
        options: [yt-kissa, yt-unoreverse]

permissions:
  contents: write

concurrency:
  group: hope-episode-${{ github.run_id }}  # Post now: starts at once, never waits behind the daily queue (state.py saves merge)

env:
  TZ: Asia/Kolkata
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: 1  # log lines show when each step really happened
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}  # talking hosts; without it Kling on fal.ai is used
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}  # voices; without it the free Edge voices are used
  MUSIC_MAKER: ${{ vars.MUSIC_MAKER }}  # background music: ElevenLabs (owner keeps the rights) unless set to fal
  ELEVEN_VOICE_ARJUN: ${{ vars.ELEVEN_VOICE_ARJUN }}  # optional ElevenLabs voice ids (Variables tab)
  ELEVEN_VOICE_MEERA: ${{ vars.ELEVEN_VOICE_MEERA }}
  ELEVEN_VOICE_MALE: ${{ vars.ELEVEN_VOICE_MALE }}
  ELEVEN_VOICE_FEMALE: ${{ vars.ELEVEN_VOICE_FEMALE }}
  AI_CLIPS_PER_SHORT: ${{ vars.AI_CLIPS_PER_SHORT || '3' }}  # paid Kling video shots per Short (about $0.30 each)
  DAILY_BUDGET: "1000"  # Post now overrules the daily budget

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |  # Hindi captions
          { sudo apt-get install -y -qq fonts-noto-core || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core; }; } > /dev/null
      - run: printf '%s' "$CLIENT_SECRET" > client_secret.json
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      - run: python state.py load
      - name: Unlock channel sign-ins
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true
      - name: Write and post the episode
        env:
          CHANNEL: ${{ inputs.channel || 'yt-kissa' }}
        run: |
          token=$(python -c "import json; print(next(c['token'] for c in json.load(open('channels.json')) if c['id'] == '$CHANNEL'))")
          [ -f "$token" ] || { echo "$CHANNEL isn't connected: run the Connect a channel workflow"; exit 1; }
          python series.py "$CHANNEL"
          python video.py --only "$CHANNEL"
      - name: Save Hope's memory
        if: always()
        run: python state.py save
