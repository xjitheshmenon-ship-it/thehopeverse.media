# Write and post one Kissa episode right now, without the rest of the daily run.
# Actions > "Post a Kissa episode" > Run workflow.
name: Post a Kissa episode

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-daily  # never at the same time as a daily run, so they don't overwrite each other's memory

env:
  TZ: Asia/Kolkata
  PYTHONIOENCODING: utf-8
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  DAILY_BUDGET: ${{ vars.DAILY_BUDGET || '20' }}

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null  # Hindi captions
      - run: printf '%s' "$CLIENT_SECRET" > client_secret.json
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      - run: python state.py load
      - name: Unlock channel sign-ins
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true
      - name: Write and post the episode
        run: |
          [ -f token-series.json ] || { echo "Kissa isn't connected: run the Connect a channel workflow"; exit 1; }
          python series.py
          python video.py --only yt-kissa
      - name: Save Hope's memory
        if: always()
        run: python state.py save
