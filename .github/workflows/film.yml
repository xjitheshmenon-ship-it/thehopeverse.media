# Make a cinematic Short cut to a music track (film.py), for the owner to review; nothing is uploaded unless post= is set.
# After the owner approves a film, rerun with post=yt-aether: it reuses the saved clips (no new cost) and uploads it.
# Start it by pushing a branch named run/film with "name=<name>" in the commit message (films/<name>.json).
# The finished video lands on the music-tracks branch under films/. The paid AI clips are saved there too, even if
# the run fails, so a rerun reuses them instead of paying again.
name: Make a cinematic Short

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Film file in films/, without .json"
        required: true
      post:
        description: "Channel to upload the finished film to (empty = review only)"
        default: ""
      video:
        description: "With post: the id of a film already posted there; only its title and description are rewritten"
        default: ""

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      NAME: ${{ inputs.name }}
      POST: ${{ inputs.post }}
      VIDEO: ${{ inputs.video }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -r requirements.txt fal-client imageio-ffmpeg
      - run: |
          git fetch origin music-tracks && git worktree add out origin/music-tracks
          mkdir -p "films/$NAME" && cp out/films/"$NAME"/raw-*.mp4 "films/$NAME/" 2>/dev/null || true
      - name: Unlock the channel's sign-in (only when posting)
        if: inputs.post != ''
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python state.py load
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true
      - run: python film.py "films/$NAME.json"
      - if: always()
        run: |
          mkdir -p "out/films/$NAME" && cp films/"$NAME"/raw-*.mp4 "out/films/$NAME/" 2>/dev/null || true
          cp "films/$NAME.mp4" out/films/ 2>/dev/null || true
          git config --global user.name hope && git config --global user.email hope@users.noreply.github.com  # rebase on pull needs it too
          cd out && git checkout -q -B music-tracks
          git add . && git -c user.name=hope -c user.email=hope@users.noreply.github.com commit -qm "Film: $NAME" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin music-tracks && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" music-tracks && exit 0; sleep 5; done; exit 1  # a track and a film can finish together
