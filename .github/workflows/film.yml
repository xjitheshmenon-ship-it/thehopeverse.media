# Make a cinematic Short cut to a music track (film.py), for the owner to review; nothing is uploaded.
# Start it by pushing a branch named run/film with "name=<name>" in the commit message (films/<name>.json).
# The finished video lands on the music-tracks branch under films/. The paid AI clips are saved there too, even if
# the run fails, so a rerun reuses them instead of paying again.
name: Make a cinematic Short

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Film file in films/, without .json"
        required: true

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q fal-client imageio-ffmpeg
      - run: |
          git fetch origin music-tracks && git worktree add out origin/music-tracks
          mkdir -p "films/$NAME" && cp out/films/"$NAME"/raw-*.mp4 "films/$NAME/" 2>/dev/null || true
      - run: python film.py "films/$NAME.json"
      - if: always()
        run: |
          mkdir -p "out/films/$NAME" && cp films/"$NAME"/raw-*.mp4 "out/films/$NAME/" 2>/dev/null || true
          cp "films/$NAME.mp4" out/films/ 2>/dev/null || true
          cd out && git checkout -q -B music-tracks
          git add . && git -c user.name=hope -c user.email=hope@users.noreply.github.com commit -qm "Film: $NAME" || exit 0
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" music-tracks
