# The dashboard talks to Hope through GitHub issues: its "Send to Hope" buttons open a filled-in new issue, and
# pressing Submit runs this. Only the repo owner's issues count.
#   "Topics for Hope": lines "ok <id>" / "no <id>" approve or reject planned topics (no script before approval)
#   "Note for Hope":   a message Mr. Hope reads on his next runs and answers in his summary
name: Dashboard to Hope
run-name: "Dashboard: ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: approve  # one at a time, so two quick sends never overwrite each other

jobs:
  save:
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'Topics for Hope') || startsWith(github.event.issue.title, 'Note for Hope'))
    runs-on: ubuntu-latest
    env:
      BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python state.py load
      - name: Save the approvals and start the next video
        if: startsWith(github.event.issue.title, 'Topics for Hope')
        run: |
          said=$(python state.py approve)
          gh issue close "$N" -c "Saved: $said. The next approved video starts now; the dashboard shows it within the hour."
          gh workflow run hope.yml --ref main -f job=next  # waits behind a running video; plans new topics for rejected ones
      - name: Save the message for Mr. Hope
        if: startsWith(github.event.issue.title, 'Note for Hope')
        run: |
          python state.py note
          gh issue close "$N" -c "Saved. Mr. Hope reads it on his next run and replies in his summary on the dashboard."
