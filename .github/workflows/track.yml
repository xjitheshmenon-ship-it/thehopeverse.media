# Make one music track for the future music channel on the owner's ElevenLabs plan (Mr. Raga's brief in
# tracks/<name>.json). Each take and its proof record (prompt, model, time, ElevenLabs song id) land on the
# music-tracks branch. Start it by pushing a branch named run/track with "name=<name>" in the commit message.
name: Make a music track

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Track file in tracks/, without .json"
        required: true

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin music-tracks && git worktree add out origin/music-tracks || (mkdir out && git -C out init -q)
      - name: Takes from ElevenLabs Music
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          name = os.environ["NAME"]
          track = json.loads(Path(f"tracks/{name}.json").read_text(encoding="utf-8"))
          out = Path("out") / name
          out.mkdir(parents=True, exist_ok=True)
          # Inpainting: "upload" names a take on music-tracks (e.g. "semma-paiyan-v4/take2.mp3"). It is stored at ElevenLabs
          # once (upload.json keeps the song id, word timings and its plan); "SOURCE" in the plan becomes that song id.
          if "upload" in track:
              up = out / "upload.json"
              if not up.exists():
                  import subprocess
                  res = subprocess.run(["curl", "-sS", "--fail-with-body", "-m", "600", "https://api.elevenlabs.io/v1/music/upload",
                                        "-H", "xi-api-key: " + os.environ["ELEVENLABS_API_KEY"].strip(),
                                        "-F", f"file=@out/{track['upload']}", "-F", "extract_composition_plan=music_v2_5",
                                        "-F", "with_timestamps=true"], capture_output=True, text=True)
                  if res.returncode:
                      raise SystemExit(f"upload failed: {res.stdout[:500]} {res.stderr[:300]}")
                  up.write_text(res.stdout, encoding="utf-8")
              song_id = json.loads(up.read_text(encoding="utf-8"))["song_id"]
              print(f"source song id {song_id}")
              if "plan" not in track:
                  raise SystemExit(0)  # upload only: read upload.json, then write the plan
              track["plan"] = json.loads(json.dumps(track["plan"]).replace('"SOURCE"', json.dumps(song_id)))
          for take in range(1, track.get("takes", 1) + 1):
              # A v2 plan has "chunks" (v1 can't read it); a v1 plan has "sections" (only v1 reads it).
              for model in (("music_v2_5", "music_v2") if "chunks" in track.get("plan", {}) else ("music_v2", "music_v1")):  # v2 sounds better; v1 if the plan doesn't offer it
                  # A composition plan holds each section to its length (no drifting gaps); else the plain prompt.
                  body = ({"composition_plan": track["plan"], "model_id": model} if "plan" in track else
                          {"prompt": track["prompt"], "model_id": model, "force_instrumental": track.get("instrumental", True),
                           "music_length_ms": int(track["seconds"] * 1000)})
                  req = urllib.request.Request(
                      "https://api.elevenlabs.io/v1/music?output_format=mp3_44100_192", method="POST",
                      data=json.dumps(body).encode(),
                      headers={"xi-api-key": os.environ["ELEVENLABS_API_KEY"].strip(), "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=600) as r:
                          (out / f"take{take}.mp3").write_bytes(r.read())
                          song = r.headers.get("song-id", "")
                  except Exception as e:
                      print(f"take {take} with {model} failed: {e} {getattr(e, 'read', lambda: b'')()[:300]!r}")
                      continue
                  # The proof record keeps who made what, when and how, for copyright and distributor questions.
                  (out / f"take{take}.proof.json").write_text(json.dumps({
                      "title": track["title"], "take": take, "made_at_utc": datetime.now(timezone.utc).isoformat(),
                      "maker": "ElevenLabs Music API on the owner's paid plan", "model": model,
                      "elevenlabs_song_id": song, "request": body, "brief": track["brief"], "story": track["story"],
                      "human_work": "to be added by the owner: melody, take choice, edits, mix"}, indent=2), encoding="utf-8")
                  print(f"take {take}: {model}, song id {song}")
                  break
          if not list(out.glob("*.mp3")):
              raise SystemExit("no take was made")
          PY
      - run: |
          cd out
          git checkout -q -B music-tracks
          git config user.name hope && git config user.email hope@users.noreply.github.com  # the rebase below needs it too
          git add . && git commit -qm "Track: $NAME"
          for i in 1 2 3; do git pull -q --rebase origin music-tracks && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" music-tracks && exit 0; sleep 5; done; exit 1  # a track and a film can finish together
