# Mr. Hope on GitHub's servers: no PC needed. Keys live in Settings > Secrets and variables > Actions.
# Hope's memory (outbox, lessons.md, characters.md, run logs) is kept on the `state` branch by state.py.
name: Hope
run-name: "Hope: ${{ github.event.schedule == '15 * * * *' && 'dashboard refresh (posts nothing)' || inputs.job == 'stats' && 'dashboard refresh (posts nothing)' || inputs.job == 'plan' && 'plan topics (posts nothing)' || inputs.job == 'story' && format('post a true rescue story Short now for {0}', inputs.channel) || inputs.job == 'publish' && format('make Short {0} public now', inputs.topic) || inputs.job == 'remake' && format('remake held Short {0}', inputs.topic) || inputs.job == 'refresh' && format('refresh footers on {0}', inputs.channel) || inputs.job == 'one' && format('post one Short now for {0}', inputs.channel) || (github.event.schedule == '30 11 * * *' || inputs.job == 'report' || inputs.job == 'daily') && '5 PM report (posts nothing)' || 'next video' }}"

on:
  schedule:
    - cron: "30 22 * * *"  # 04:00 IST (next day): start the day's videos; each run makes one and starts the next (plan.py --due)
    - cron: "30 11 * * *"  # 17:00 IST: the daily report and new channel idea
    - cron: "15 * * * *"   # hourly: dashboard numbers
  workflow_dispatch:
    inputs:
      job:
        description: "next = make and post the next video of the day (one channel at a time, then it starts the next; stops when every channel has its count), report = the 5 PM report and channel idea, one = make and post the next planned Short now for the channel below, story = make and post a true animal rescue story Short now (AI re-enactment) for the channel below, stats = dashboard numbers only, plan = plan the next 6 topics per channel (slot is the same as next; to sign a channel in, use the Connect a channel workflow)"
        default: next
        type: choice
        options: [next, report, one, story, publish, refresh, stats, plan, slot, audience, remake, dub]
      channel:
        description: "For job one or story: which channel's Short to post now. For job refresh: the channel whose uploads get its current footer and tags"
        default: yt-hopeverse
        type: choice
        options: [yt-hopeverse, yt-instinct, yt-instinct-de, yt-instinct-es, yt-instinct-ja, yt-sankalp, yt-sawaal]
      topic:
        description: "For job one or story: the topic or true story (empty = the planned one / find one). For job publish: the YouTube id of a scheduled Short to make public now. For job remake: the held Short's outbox file (e.g. yt-sawaal-17.hi.json). For job dub: the posted Shorts to re-voice for the channel above, space-separated (e.g. yt-instinct-4 yt-instinct-2)"
        default: ""
        type: string
      when:
        description: "For job story: when it goes public, in the channel's time zone (e.g. 2026-10-30 12:30; empty = its next free slot). It counts toward that day's videos"
        default: ""
        type: string

permissions:
  contents: write
  actions: write  # dashboard.py lists recent runs; each video run starts the next one

concurrency:
  # one video at a time: every "next" run waits in hope-daily. Post now (job one) gets a group of its own, so it
  # starts at once and never waits behind the queue or another Post now
  group: hope-${{ inputs.job == 'one' && format('one-{0}', github.run_id) || github.event.schedule == '15 * * * *' && 'stats' || github.event.schedule == '30 11 * * *' && 'report' || inputs.job == 'slot' && 'daily' || inputs.job == 'next' && 'daily' || inputs.job || 'daily' }}

env:
  TZ: Asia/Kolkata
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: 1  # log lines show when each step really happened
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  FAL_BILLING_KEY: ${{ secrets.FAL_BILLING_KEY }}  # optional READONLY fal.ai key, so the dashboard can show the balance
  HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}  # talking hosts; without it Kling on fal.ai is used
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}  # voices; without it the free Edge voices are used
  MUSIC_RAGA: ${{ vars.MUSIC_RAGA }}  # 1 = Mr. Raga writes the music (kept for the future music channel; off for Shorts)
  MUSIC_MAKER: ${{ vars.MUSIC_MAKER }}  # with MUSIC_RAGA: ElevenLabs (owner keeps the rights) unless set to fal
  ELEVEN_VOICE_ARJUN: ${{ vars.ELEVEN_VOICE_ARJUN }}  # optional ElevenLabs voice ids (Variables tab)
  ELEVEN_VOICE_MEERA: ${{ vars.ELEVEN_VOICE_MEERA }}
  ELEVEN_VOICE_NIMA: ${{ vars.ELEVEN_VOICE_NIMA }}  # Nima's own voice; else the account's default female voice
  ELEVEN_VOICE_MALE: ${{ vars.ELEVEN_VOICE_MALE }}
  ELEVEN_VOICE_FEMALE: ${{ vars.ELEVEN_VOICE_FEMALE }}
  AI_CLIPS_PER_SHORT: ${{ vars.AI_CLIPS_PER_SHORT || '3' }}  # paid Kling video shots per Short (about $0.30 each)
  INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
  # Settings > Secrets and variables > Actions > Variables: change these without editing this file
  SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY || '6' }}  # Hopeverse Media's count only when channels.json gives it no per_day (it has 4 since 2026-10-28); other channels: per_day, default 2
  SERIES_PER_DAY: ${{ vars.SERIES_PER_DAY || '2' }}  # Kissa episodes a day: 1, 2, 3 or 6 (owner's pick 2026-10-26: 2, each fully acted, within DAILY_BUDGET)
  RELEVANCE_MIN: ${{ vars.RELEVANCE_MIN || '60' }}  # a finished Short must score this (0-100) on its relevance check to be made and posted
  AUTO_APPROVE_SCORE: ${{ vars.AUTO_APPROVE_SCORE || '80' }}  # a planned topic scoring this goes ahead without the owner's Approve (owner's pick 2026-10-27); Reject still stops it
  DAILY_BUDGET: ${{ vars.DAILY_BUDGET || '20' }}     # US dollars a day across everything; runs stop once reached

jobs:
  hope:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # each 2-hour slot must finish before the next one
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: YouTube sign-in files
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TOKEN_HI: ${{ secrets.YOUTUBE_TOKEN_HI }}
          TOKEN_SERIES: ${{ secrets.YOUTUBE_TOKEN_SERIES }}
        run: |
          [ -n "$CLIENT_SECRET" ] && printf '%s' "$CLIENT_SECRET" > client_secret.json
          [ -n "$TOKEN" ] && printf '%s' "$TOKEN" > token.json
          [ -n "$TOKEN_HI" ] && printf '%s' "$TOKEN_HI" > token-hi.json
          [ -n "$TOKEN_SERIES" ] && printf '%s' "$TOKEN_SERIES" > token-series.json
          true
      - run: python state.py load
      - name: Unlock channel sign-ins saved by the Connect a channel workflow
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true

      - name: Which video is next
        if: github.event.schedule == '30 22 * * *' || inputs.job == 'next' || inputs.job == 'slot'
        # NEXT = the channel, N = its video number today, QUOTA its daily count, REVIEW on its last, SERIES for Kissa,
        # GROW before the day's first video, MORE when another video follows; nothing when the day's videos are done
        run: python plan.py --due | tee -a "$GITHUB_ENV"

      - name: Stop if today's budget is used up
        if: env.NEXT != ''  # Post now (job one) overrules the daily budget: the owner asked for it
        run: |
          python -c "import sys, agents as a; s = a.spent_today(); sys.exit(f'Daily budget used up: \${s:.2f} of \${a.DAILY_BUDGET:.0f} spent today, so nothing is made until tomorrow (raise DAILY_BUDGET to post more)' if s >= a.DAILY_BUDGET else 0)" || { echo "::error::Daily budget used up, nothing posted"; echo "MORE=0" >> "$GITHUB_ENV"; exit 1; }
      - name: Research, script, make and post the next Short
        if: env.NEXT != '' && env.SERIES != '1'
        run: |
          { sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk; }; } > /dev/null  # Hindi captions
          [ "$GROW" = 1 ] && { python agents.py --grow || true; }  # Mr. Grow's notes for the day's Shorts
          id=$NEXT
          if [ "$id" = yt-hopeverse ]; then
            goal="get today's topics from Mr. Focus, check list_outbox, then draft and queue the best new current-affairs YouTube Short for $id, aimed at a global audience, on a story not already drafted today."
          else
            goal="check list_channels and list_outbox, then draft and queue one new YouTube Short for $id that fits its niche, audience and language, on a topic it hasn't had yet."
          fi
          cp runs/plan.json "$RUNNER_TEMP/plan.json" 2>/dev/null || true
          topic=$(python plan.py --next "$id" || true)  # the topic the dashboard showed for this video
          [ -n "$topic" ] && goal="make the Short on the planned topic \"$topic\" (check list_outbox and that it is still accurate and new; if not, pick the best alternative), then $goal"
          before=$(ls outbox/*.json 2>/dev/null | wc -l)
          HOPE_CHANNEL=$id HOPE_REVIEW=$REVIEW python agents.py "Scheduled run, Short $N of $QUOTA today for channel $id: $goal" || true
          ok=0; [ "$(ls outbox/*.json 2>/dev/null | wc -l)" -gt "$before" ] || { echo "::error::No Short was drafted (see Mr. Hope's log above)"; ok=1
            cp "$RUNNER_TEMP/plan.json" runs/plan.json 2>/dev/null; sed -i '$d' runs/slots.jsonl
            echo MORE=0 >> "$GITHUB_ENV"; }  # keep the approved topic and slot for a rerun, and stop the chain (e.g. no API credit)
          python video.py --only "$id" || ok=1  # red when the Short couldn't be made or posted
          exit $ok
      - name: Make and post one Short now
        if: inputs.job == 'one'
        env:
          CHANNEL: ${{ inputs.channel || 'yt-hopeverse' }}
          DAILY_BUDGET: "1000"  # Post now overrules the daily budget
          TOPIC: ${{ inputs.topic }}  # optional: the owner's topic, instead of the planned one
        run: |
          { sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk; }; } > /dev/null
          if [ "$CHANNEL" = yt-hopeverse ]; then
            goal="get today's topics from Mr. Focus, check list_outbox, then draft and queue one new current-affairs YouTube Short for yt-hopeverse, aimed at a global audience, on the top-viewed story of the last 48 hours that is not already drafted."
          else
            goal="check list_channels and list_outbox, then draft and queue one new YouTube Short for $CHANNEL that fits its niche, audience and language, on a topic it hasn't had yet."
          fi
          topic=${TOPIC:-$(python plan.py --next "$CHANNEL" --any || true)}  # Post now: an approved topic first, else the next planned one
          [ -n "$topic" ] && goal="make the Short on the planned topic \"$topic\" (check list_outbox and that it is still accurate and new; if not, pick the best alternative), then $goal"
          before=$(ls outbox/*.json 2>/dev/null | wc -l)
          HOPE_CHANNEL=$CHANNEL HOPE_REVIEW=0 python agents.py "One-off run requested by the owner: $goal"
          [ "$(ls outbox/*.json 2>/dev/null | wc -l)" -gt "$before" ] || { echo "::error::No Short was drafted"; exit 1; }
          python video.py
      - name: Make and post a true rescue story Short now
        if: inputs.job == 'story'
        env:
          CHANNEL: ${{ inputs.channel || 'yt-instinct' }}
          TOPIC: ${{ inputs.topic }}
          WHEN: ${{ inputs.when }}
          DAILY_BUDGET: "1000"  # asked for by the owner, like Post now
        run: |
          { sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk; }; } > /dev/null
          python story.py "$CHANNEL" "$TOPIC"
          python video.py --only "$CHANNEL"
      - name: Make a scheduled Short public now
        if: inputs.job == 'publish'
        env:
          VIDEO: ${{ inputs.topic }}
        run: python video.py --publish "$VIDEO"
      - name: Make a held Short again (same script, new footage) and post it
        if: inputs.job == 'remake'
        env:
          VIDEO: ${{ inputs.topic }}
          DAILY_BUDGET: "1000"  # the owner asked for it, like Post now
        run: |
          { sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk; }; } > /dev/null
          python -c "import json, os, pathlib; p = pathlib.Path('outbox', os.environ['VIDEO']); d = json.loads(p.read_text()); [d.pop(k, None) for k in ('held', 'qa', 'render_failed')]; p.write_text(json.dumps(d, indent=2, ensure_ascii=False)); print(d['channel_id'])" > "$RUNNER_TEMP/channel"
          rm -f "outbox/${VIDEO%.json}.mp4"
          python video.py --only "$(cat "$RUNNER_TEMP/channel")"
      - name: Re-voice posted Shorts for another channel (same scenes, new language) and post them in its slots
        if: inputs.job == 'dub'
        env:
          CHANNEL: ${{ inputs.channel }}
          VIDEOS: ${{ inputs.topic }}
          DAILY_BUDGET: "1000"  # the owner asked for it, like Post now
        run: |
          { sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk; }; } > /dev/null
          python video.py --dub-to "$CHANNEL" $VIDEOS
          for v in $VIDEOS; do python video.py --only "$CHANNEL" || true; done  # one video per run of video.py
      - name: Who watches the channel (age, gender, countries, traffic; last 28 days)
        if: inputs.job == 'audience'
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python breakout.py --audience "$CHANNEL"
      - name: Put the channel's current footer and tags on all its uploads
        if: inputs.job == 'refresh'
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python video.py --refresh "$CHANNEL"
      - name: Write and post the next series episode (Kissa, Uno Reverse, Nima)
        if: env.SERIES == '1'
        run: |
          python series.py "$NEXT" || true
          python video.py --only "$NEXT"
      - name: 5 PM report with today's new channel idea and its brand kit
        if: github.event.schedule == '30 11 * * *' || inputs.job == 'report' || inputs.job == 'daily'
        run: |
          mark="{\"report\": \"$(date +%F)\"}"  # once a day, also next to a backup run
          grep -qxF "$mark" runs/slots.jsonl 2>/dev/null && { echo "Today's report is already written"; exit 0; }
          mkdir -p runs && echo "$mark" >> runs/slots.jsonl
          echo "RAN=1" >> "$GITHUB_ENV"
          python video.py || true  # anything left over from a failed upload today
          python scout.py || true  # also rewrites runs/spend-report.md
      - name: Plan the next 6 topics per channel (shown on the dashboard)
        if: always() && (env.RAN == '1' || inputs.job == 'one' || inputs.job == 'plan')
        run: python plan.py || true
      - name: Save Hope's memory
        if: always() && (env.RAN == '1' || inputs.job == 'one' || inputs.job == 'story' || inputs.job == 'publish' || inputs.job == 'remake' || inputs.job == 'dub' || inputs.job == 'plan')
        run: python state.py save
      - name: Start the next video
        if: always() && env.MORE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import sys, agents as a; sys.exit(a.spent_today() >= a.DAILY_BUDGET)" || { echo "Daily budget used up: no more videos today"; exit 0; }
          gh workflow run hope.yml --ref "$GITHUB_REF_NAME" -f job=next

      - name: Dashboard numbers (and a deep study of any Short that broke out, on the hourly run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BREAKOUTS: ${{ inputs.job == 'stats' || github.event.schedule == '15 * * * *' }}
          BREAKOUT_X: ${{ vars.BREAKOUT_X || '3' }}  # a Short with this many times its channel's usual views counts as a breakout
          BREAKOUT_MIN_VIEWS: ${{ vars.BREAKOUT_MIN_VIEWS || '50' }}
        run: python dashboard.py
