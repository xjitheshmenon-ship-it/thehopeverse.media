# Mr. Hope on GitHub's servers: no PC needed. Keys live in Settings > Secrets and variables > Actions.
# Hope's memory (outbox, lessons.md, characters.md, run logs) is kept on the `state` branch by state.py.
name: Hope
run-name: "Hope: ${{ github.event.schedule == '15 * * * *' && 'dashboard refresh (posts nothing)' || inputs.job == 'stats' && 'dashboard refresh (posts nothing)' || inputs.job == 'plan' && 'plan topics (posts nothing)' || inputs.job == 'one' && format('post one Short now for {0}', inputs.channel) || inputs.job == 'daily' && '5 PM slot and report' || '2-hour slot' }}"

on:
  schedule:
    - cron: "30 1-20 * * *"  # hourly check: each channel posts every 2 hours in its audience's time zone (plan.py --due); 5 PM IST also writes the report
    - cron: "15 * * * *"   # hourly: dashboard numbers
  workflow_dispatch:
    inputs:
      job:
        description: "slot = run the current 2-hour slot now (what the schedule does; skipped if it already ran), daily = run the 5 PM slot now (a Short per channel, review, channel idea, report), one = make and post the next planned Short now for the channel below, stats = dashboard numbers only, plan = plan the next 6 topics per channel (to sign a channel in, use the Connect a channel workflow; a Kissa episode: Post a Kissa episode)"
        default: daily
        type: choice
        options: [daily, slot, one, stats, plan]
      channel:
        description: "For job one: which channel's Short to post now"
        default: yt-hopeverse
        type: choice
        options: [yt-hopeverse, yt-instinct, yt-sankalp, yt-sawaal]

permissions:
  contents: write
  actions: read  # dashboard.py lists recent runs and failures

concurrency:
  group: hope-${{ github.event.schedule == '15 * * * *' && 'stats' || inputs.job == 'slot' && 'daily' || inputs.job || 'daily' }}

env:
  TZ: Asia/Kolkata
  PYTHONIOENCODING: utf-8
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  FAL_BILLING_KEY: ${{ secrets.FAL_BILLING_KEY }}  # optional READONLY fal.ai key, so the dashboard can show the balance
  HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}  # talking hosts; without it Kling on fal.ai is used
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}  # voices; without it the free Edge voices are used
  ELEVEN_VOICE_ARJUN: ${{ vars.ELEVEN_VOICE_ARJUN }}  # optional ElevenLabs voice ids (Variables tab)
  ELEVEN_VOICE_MEERA: ${{ vars.ELEVEN_VOICE_MEERA }}
  ELEVEN_VOICE_MALE: ${{ vars.ELEVEN_VOICE_MALE }}
  ELEVEN_VOICE_FEMALE: ${{ vars.ELEVEN_VOICE_FEMALE }}
  AI_CLIPS_PER_SHORT: ${{ vars.AI_CLIPS_PER_SHORT || '3' }}  # paid Kling video shots per Short (about $0.30 each)
  INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
  # Settings > Secrets and variables > Actions > Variables: change these without editing this file
  SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY || '6' }}  # Hopeverse Media, one per 2-hour slot (at most 6); other channels post 2 a day (channels.json per_day)
  SERIES_PER_DAY: ${{ vars.SERIES_PER_DAY || '2' }}  # Kissa episodes a day: 1, 2, 3 or 6 (owner's pick 2026-10-26: 2, each fully acted, within DAILY_BUDGET)
  DAILY_BUDGET: ${{ vars.DAILY_BUDGET || '20' }}     # US dollars a day across everything; runs stop once reached

jobs:
  hope:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # each 2-hour slot must finish before the next one
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: YouTube sign-in files
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TOKEN_HI: ${{ secrets.YOUTUBE_TOKEN_HI }}
          TOKEN_SERIES: ${{ secrets.YOUTUBE_TOKEN_SERIES }}
        run: |
          [ -n "$CLIENT_SECRET" ] && printf '%s' "$CLIENT_SECRET" > client_secret.json
          [ -n "$TOKEN" ] && printf '%s' "$TOKEN" > token.json
          [ -n "$TOKEN_HI" ] && printf '%s' "$TOKEN_HI" > token-hi.json
          [ -n "$TOKEN_SERIES" ] && printf '%s' "$TOKEN_SERIES" > token-series.json
          true
      - run: python state.py load
      - name: Unlock channel sign-ins saved by the Connect a channel workflow
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true

      - name: Which 2-hour slot this is
        if: github.event.schedule == '30 1-20 * * *' || inputs.job == 'daily' || inputs.job == 'slot'
        # DUE = channel:slot:review for each channel posting now, SERIES = a Kissa episode, REPORT = the 5 PM report;
        # a manual daily run counts as the last slot for every channel
        run: python plan.py --due ${{ inputs.job == 'daily' && '--force 6' || '' }} | tee -a "$GITHUB_ENV"

      - name: Stop if today's budget is used up
        if: env.DUE != '' || inputs.job == 'one'
        run: |
          python -c "import sys, agents as a; s = a.spent_today(); sys.exit(f'Daily budget used up: \${s:.2f} of \${a.DAILY_BUDGET:.0f} spent today, so nothing is made until tomorrow (raise DAILY_BUDGET to post more)' if s >= a.DAILY_BUDGET else 0)" || { echo "::error::Daily budget used up, nothing posted"; exit 1; }
      - name: Research, script and make this slot's Short for every live channel
        if: env.DUE != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null  # Hindi captions
          before=$(ls outbox/*.json 2>/dev/null | wc -l)
          [ "$SLOT" = 1 ] && { python agents.py --grow || true; }  # Mr. Grow's notes for the day's Shorts
          for entry in $DUE; do
            IFS=: read -r id SLOT REVIEW <<< "$entry"
            aud=$([ $((SLOT * 3)) -le $((SHORTS_PER_DAY * 2)) ] && echo "Indian viewers" || echo "the international market")  # 4 of 6 for India
            if [ "$id" = yt-hopeverse ]; then
              goal="get today's topics from Mr. Focus, check list_outbox, then draft and queue the best new current-affairs YouTube Short for $id, aimed at $aud, on a story not already drafted today."
            else
              goal="check list_channels and list_outbox, then draft and queue one new YouTube Short for $id that fits its niche, audience and language, on a topic it hasn't had yet."
            fi
            topic=$(python plan.py --next "$id" || true)  # the topic the dashboard showed for this slot
            [ -n "$topic" ] && goal="make the Short on the planned topic \"$topic\" (check list_outbox and that it is still accurate and new; if not, pick the best alternative), then $goal"
            HOPE_CHANNEL=$id HOPE_REVIEW=$REVIEW python agents.py "Scheduled run, Short $SLOT of $SHORTS_PER_DAY today for channel $id: $goal" || true
          done
          ok=0; [ "$(ls outbox/*.json 2>/dev/null | wc -l)" -gt "$before" ] || { echo "::error::No Short was drafted in this slot (see Mr. Hope's log above)"; ok=1; }
          python video.py || ok=1  # fails when a Short couldn't be made or posted, so the run shows red
          exit $ok
      - name: Make and post one Short now
        if: inputs.job == 'one'
        env:
          CHANNEL: ${{ inputs.channel || 'yt-hopeverse' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null
          if [ "$CHANNEL" = yt-hopeverse ]; then
            goal="get today's topics from Mr. Focus, check list_outbox, then draft and queue one new current-affairs YouTube Short for yt-hopeverse, aimed at Indian viewers, on the top-viewed story of the last 48 hours that is not already drafted."
          else
            goal="check list_channels and list_outbox, then draft and queue one new YouTube Short for $CHANNEL that fits its niche, audience and language, on a topic it hasn't had yet."
          fi
          topic=$(python plan.py --next "$CHANNEL" || true)  # post the next planned topic now
          [ -n "$topic" ] && goal="make the Short on the planned topic \"$topic\" (check list_outbox and that it is still accurate and new; if not, pick the best alternative), then $goal"
          before=$(ls outbox/*.json 2>/dev/null | wc -l)
          HOPE_CHANNEL=$CHANNEL HOPE_REVIEW=0 python agents.py "One-off run requested by the owner: $goal"
          [ "$(ls outbox/*.json 2>/dev/null | wc -l)" -gt "$before" ] || { echo "::error::No Short was drafted"; exit 1; }
          python video.py
      - name: Write and post this slot's Hindi series episode
        if: always() && env.SERIES == '1'  # episodes are spaced evenly and always include Kissa's last slot
        run: |
          python series.py || true
          python video.py
      - name: 5 PM report with today's new channel idea and its brand kit
        if: always() && env.REPORT == '1'
        run: python scout.py || true  # also rewrites runs/spend-report.md
      - name: Plan the next 6 topics per channel (shown on the dashboard)
        if: always() && (env.RAN == '1' || inputs.job == 'one' || inputs.job == 'plan')
        run: python plan.py || true
      - name: Save Hope's memory
        if: always() && (env.RAN == '1' || inputs.job == 'one' || inputs.job == 'plan')
        run: python state.py save

      - name: Dashboard numbers
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dashboard.py
