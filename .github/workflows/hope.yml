# Mr. Hope on GitHub's servers: no PC needed. Keys live in Settings > Secrets and variables > Actions.
# Hope's memory (outbox, lessons.md, characters.md, run logs) is kept on the `state` branch by state.py.
name: Hope

on:
  schedule:
    - cron: "45 11 * * *"  # 17:15 IST: research, make and post today's Shorts (6 per channel take 2-4 hours)
    - cron: "15 * * * *"   # hourly: dashboard numbers
  workflow_dispatch:
    inputs:
      job:
        description: "daily = make and post today's Shorts, stats = dashboard numbers only (to sign a channel in, use the Connect a channel workflow)"
        default: daily
        type: choice
        options: [daily, stats]

permissions:
  contents: write

concurrency:
  group: hope-${{ github.event.schedule == '15 * * * *' && 'stats' || inputs.job || 'daily' }}

env:
  TZ: Asia/Kolkata
  PYTHONIOENCODING: utf-8
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}  # voices; without it the free Edge voices are used
  ELEVEN_VOICE_ARJUN: ${{ vars.ELEVEN_VOICE_ARJUN }}  # optional ElevenLabs voice ids (Variables tab)
  ELEVEN_VOICE_MEERA: ${{ vars.ELEVEN_VOICE_MEERA }}
  ELEVEN_VOICE_MALE: ${{ vars.ELEVEN_VOICE_MALE }}
  ELEVEN_VOICE_FEMALE: ${{ vars.ELEVEN_VOICE_FEMALE }}
  AI_CLIPS_PER_SHORT: ${{ vars.AI_CLIPS_PER_SHORT || '3' }}  # paid Kling video shots per Short (about $0.30 each)
  INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
  # Settings > Secrets and variables > Actions > Variables: change these without editing this file
  SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY || '6' }}  # per channel, for the 100-day plan
  DAILY_BUDGET: ${{ vars.DAILY_BUDGET || '20' }}     # US dollars a day across everything; runs stop once reached

jobs:
  hope:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: YouTube sign-in files
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TOKEN_HI: ${{ secrets.YOUTUBE_TOKEN_HI }}
          TOKEN_SERIES: ${{ secrets.YOUTUBE_TOKEN_SERIES }}
        run: |
          [ -n "$CLIENT_SECRET" ] && printf '%s' "$CLIENT_SECRET" > client_secret.json
          [ -n "$TOKEN" ] && printf '%s' "$TOKEN" > token.json
          [ -n "$TOKEN_HI" ] && printf '%s' "$TOKEN_HI" > token-hi.json
          [ -n "$TOKEN_SERIES" ] && printf '%s' "$TOKEN_SERIES" > token-series.json
          true
      - run: python state.py load
      - name: Unlock channel sign-ins saved by the Connect a channel workflow
        env:
          TOKEN_KEY: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          for f in tokens/*.enc; do
            [ -f "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in "$f" -out "$(basename "$f" .enc)"
          done
          true

      - name: Research, script and make today's Shorts for every live channel
        if: github.event.schedule == '45 11 * * *' || inputs.job == 'daily'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null  # Hindi captions
          python agents.py --grow || true  # Mr. Grow's notes for today's Shorts
          for id in $(python -c "import json; print(*[c['id'] for c in json.load(open('channels.json')) if c['platform'] == 'youtube' and c['status'] == 'live'])"); do
            for i in $(seq "$SHORTS_PER_DAY"); do
              HOPE_REVIEW=$([ "$i" = "$SHORTS_PER_DAY" ] && echo 1 || echo 0) python agents.py \
                "Scheduled run, Short $i of $SHORTS_PER_DAY today for channel $id: get today's topics from Mr. Focus, check list_outbox, then draft and queue the best new YouTube Short for $id on a topic and category not already drafted today." || true
            done
          done
          python video.py
      - name: Write and post today's Hindi series episode
        if: always() && (github.event.schedule == '45 11 * * *' || inputs.job == 'daily')
        run: |
          [ -f token-series.json ] || { echo "Series channel not connected yet: run the Connect a channel workflow"; exit 0; }
          for i in $(seq "$SHORTS_PER_DAY"); do python series.py || true; done
          python video.py
      - name: Today's new channel idea and its brand kit
        if: always() && (github.event.schedule == '45 11 * * *' || inputs.job == 'daily')
        run: python scout.py || true
      - name: Save Hope's memory
        if: always() && (github.event.schedule == '45 11 * * *' || inputs.job == 'daily')
        run: python state.py save

      - name: Dashboard numbers
        if: always()
        run: python dashboard.py
