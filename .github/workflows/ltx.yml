# LTX-2.5 test (owner, 2 Nov 2026): a few of a Short's AI shots made with open-source LTX-2.5 on a Modal GPU
# (free on Modal's $30 monthly credit), to compare with HeyGen. Nothing is uploaded.
# Start it by pushing run/ltx with "package=yt-instinct-37" and "scenes=0,3,10" lines in the commit message.
# The clips and a timing/cost report land on the music-tracks branch under ltx-test/<package>/.
name: LTX test shots

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Short in outbox/ on the state branch, without .json"
        default: "yt-instinct-37"
      scenes:
        description: "Scene numbers to remake, comma-separated"
        default: "0,3,10"
      scene_first:
        description: "yes = put the character into each scene with Qwen-Image-Edit first, then LTX animates it"
        default: "no"
      deployed:
        description: "yes = test the way video.py calls it: deploy, then one text-only shot and one scene shot"
        default: "no"

permissions:
  contents: write

jobs:
  ltx:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$HF_TOKEN" ] || { echo "::error::Add the MODAL_TOKEN_ID, MODAL_TOKEN_SECRET and HF_TOKEN secrets first"; exit 1; }
          pip install -q modal
          git fetch -q origin state
          mkdir -p outbox && git show "origin/state:outbox/$PACKAGE.json" > "outbox/$PACKAGE.json"
          git archive origin/state hosts | tar -x
      - if: inputs.deployed == 'yes'
        run: |
          modal deploy ltx.py
          python - <<'EOF'
          import json, os
          from pathlib import Path
          from ltx import ltx_clip
          s = json.loads(Path(f"outbox/{os.environ['PACKAGE']}.json").read_text())["scenes"]
          out = Path(f"ltx-test/{os.environ['PACKAGE']}/deployed"); out.mkdir(parents=True, exist_ok=True)
          print("text-only $", ltx_clip("A busy London street in 1969, red buses, people walking, cinematic.", out / "text-only.mp4"))
          print("scene $", ltx_clip(s[3]["image_prompt"], out / "scene-03.mp4", Path(f"hosts/{s[3]['on_screen'].lower()}-real.png"), s[3]["image_prompt"]))
          EOF
      - if: inputs.deployed != 'yes'
        run: modal run ltx.py --package "outbox/$PACKAGE.json" --scenes "${{ inputs.scenes }}" --out "ltx-test/$PACKAGE" $([ "${{ inputs.scene_first }}" = yes ] && echo --scene-first)
      - if: always()
        run: |
          [ -d "ltx-test/$PACKAGE" ] || exit 0
          git fetch -q origin music-tracks && git worktree add out origin/music-tracks
          mkdir -p "out/ltx-test" && cp -r "ltx-test/$PACKAGE" out/ltx-test/
          git config --global user.name hope && git config --global user.email hope@users.noreply.github.com  # rebase on pull needs it
          cd out && git checkout -q -B music-tracks && git add . && git commit -qm "LTX test: $PACKAGE" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin music-tracks && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" music-tracks && exit 0; sleep 5; done; exit 1
